name: mcp-registry

on:
  push:
    branches:
      - main
    paths:
      - 'server.json'
      - '.github/workflows/mcp-registry.yml'
  pull_request:
    paths:
      - 'server.json'
      - '.github/workflows/mcp-registry.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current server.json to the Official MCP Registry'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" |
            tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate GitHub namespace
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: ./mcp-publisher login github-oidc

      - name: Publish to Official MCP Registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: ./mcp-publisher publish server.json
