name: browser-integration

on:
  pull_request:
    paths:
      - 'src/MateMCP.Agent/Browser/**'
      - 'src/MateMCP.Agent/Tools/Browser*.cs'
      - 'tests/MateMCP.Agent.Tests/Browser*'
      - '.github/workflows/browser-integration.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/MateMCP.Agent/Browser/**'
      - 'src/MateMCP.Agent/Tools/Browser*.cs'
      - 'tests/MateMCP.Agent.Tests/Browser*'
      - '.github/workflows/browser-integration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime:
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            channel: chrome
          - os: windows-2025
            channel: msedge
    runs-on: ${{ matrix.os }}
    env:
      MATEMCP_BROWSER_INTEGRATION: '1'
      MATEMCP_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Agent tests
        run: dotnet restore tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj
      - name: Run real browser integration
        run: >-
          dotnet test tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj
          -c Release --no-restore
          --filter FullyQualifiedName~BrowserRuntimeIntegrationTests
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none
