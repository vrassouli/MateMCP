name: api-tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/MateMCP.Api/**'
      - 'tests/MateMCP.Api.Tests/**'
      - 'MateMCP.slnx'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'src/MateMCP.Api/**'
      - 'tests/MateMCP.Api.Tests/**'
      - 'MateMCP.slnx'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - run: dotnet test tests/MateMCP.Api.Tests/MateMCP.Api.Tests.csproj -c Release --no-build
