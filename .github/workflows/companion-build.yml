name: companion-build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/MateMCP.Agent.Companion/**'
      - 'src/MateMCP.Agent/**'
      - 'scripts/bootstrap-macos.sh'
      - 'scripts/bootstrap-windows.ps1'
      - 'scripts/install-macos.sh'
      - 'scripts/uninstall-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/uninstall-windows.ps1'
      - 'scripts/install-companion-macos.sh'
      - 'scripts/uninstall-companion-macos.sh'
      - 'scripts/install-companion-windows.ps1'
      - 'scripts/uninstall-companion-windows.ps1'
      - 'scripts/install-desktop-macos.sh'
      - 'scripts/uninstall-desktop-macos.sh'
      - 'scripts/install-desktop-windows.ps1'
      - 'scripts/uninstall-desktop-windows.ps1'
      - 'MateMCP.Agent.Companion.slnx'
      - 'README.md'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'src/MateMCP.Agent.Companion/**'
      - 'src/MateMCP.Agent/**'
      - 'scripts/bootstrap-macos.sh'
      - 'scripts/bootstrap-windows.ps1'
      - 'scripts/install-macos.sh'
      - 'scripts/uninstall-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/uninstall-windows.ps1'
      - 'scripts/install-companion-macos.sh'
      - 'scripts/uninstall-companion-macos.sh'
      - 'scripts/install-companion-windows.ps1'
      - 'scripts/uninstall-companion-windows.ps1'
      - 'scripts/install-desktop-macos.sh'
      - 'scripts/uninstall-desktop-macos.sh'
      - 'scripts/install-desktop-windows.ps1'
      - 'scripts/uninstall-desktop-windows.ps1'
      - 'MateMCP.Agent.Companion.slnx'
      - 'README.md'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify bootstrap syntax
        run: bash -n scripts/bootstrap-macos.sh
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Restore Companion
        run: dotnet restore src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -r maccatalyst-arm64
      - name: Build Mac Catalyst Companion
        run: dotnet build src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-maccatalyst -r maccatalyst-arm64 --no-restore
      - name: Publish Agent
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r osx-arm64 --self-contained true -o package/agent-payload
      - name: Publish Mac Catalyst Companion app bundle
        run: |
          dotnet publish src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj \
            -c Release -f net10.0-maccatalyst -r maccatalyst-arm64 \
            --self-contained true -p:CreatePackage=false --no-restore
          mkdir -p package/companion-payload
          APP_BUNDLE="$(find src/MateMCP.Agent.Companion/bin/Release/net10.0-maccatalyst/maccatalyst-arm64 -type d -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"
          cp -R "$APP_BUNDLE" package/companion-payload/
      - name: Stage unified macOS package
        run: |
          test -x package/agent-payload/MateMCP.Agent
          find package/companion-payload -maxdepth 1 -type d -name '*.app' | grep -q .
          cp scripts/install-macos.sh package/install-macos.sh
          cp scripts/uninstall-macos.sh package/uninstall-macos.sh
          cp scripts/install-companion-macos.sh package/install-companion-macos.sh
          cp scripts/uninstall-companion-macos.sh package/uninstall-companion-macos.sh
          cp scripts/install-desktop-macos.sh package/install-desktop-macos.sh
          cp scripts/uninstall-desktop-macos.sh package/uninstall-desktop-macos.sh
          chmod +x package/*.sh package/agent-payload/MateMCP.Agent
      - name: Smoke test unified macOS installer
        run: |
          package/install-desktop-macos.sh --no-start
          test -x "$HOME/.local/share/matemcp/MateMCP.Agent"
          test -d "$HOME/Applications/MateMCP Agent Companion.app"
          test -f "$HOME/Library/LaunchAgents/com.matemcp.agent.plist"
          test ! -e "$HOME/Library/LaunchAgents/com.matemcp.agent.companion.plist"
          "$HOME/Library/Application Support/MateMCP/uninstall-desktop-macos.sh"
          test ! -e "$HOME/.local/share/matemcp/MateMCP.Agent"
          test ! -e "$HOME/Applications/MateMCP Agent Companion.app"
      - name: Build unified macOS archive
        run: tar -czf MateMCP-Desktop-macos-arm64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-Desktop-macos-arm64
          path: MateMCP-Desktop-macos-arm64.tar.gz

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify bootstrap syntax
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content scripts/bootstrap-windows.ps1 -Raw))'
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Restore Companion
        run: dotnet restore src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -r win-x64
      - name: Build Windows Companion
        run: dotnet build src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore
      - name: Publish Agent
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r win-x64 --self-contained true -o package/agent-payload
      - name: Publish Windows Companion
        run: dotnet publish src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:WindowsPackageType=None -p:PublishReadyToRun=false --no-restore -o package/companion-payload
      - name: Stage unified Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path package/agent-payload/MateMCP.Agent.exe)) { throw 'Agent publish output missing.' }
          if (-not (Test-Path package/companion-payload/MateMCP.Agent.Companion.exe)) { throw 'Companion publish output missing.' }
          Copy-Item scripts/install-windows.ps1 package/install-windows.ps1
          Copy-Item scripts/uninstall-windows.ps1 package/uninstall-windows.ps1
          Copy-Item scripts/install-companion-windows.ps1 package/install-companion-windows.ps1
          Copy-Item scripts/uninstall-companion-windows.ps1 package/uninstall-companion-windows.ps1
          Copy-Item scripts/install-desktop-windows.ps1 package/install-desktop-windows.ps1
          Copy-Item scripts/uninstall-desktop-windows.ps1 package/uninstall-desktop-windows.ps1
      - name: Smoke test unified Windows installer
        shell: pwsh
        run: |
          & package/install-desktop-windows.ps1 -NoStart
          $root = Join-Path $env:LOCALAPPDATA 'MateMCP'
          $startup = [Environment]::GetFolderPath('Startup')
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $root 'MateMCP.Agent.exe'))) { throw 'Installed Agent missing.' }
          if (-not (Test-Path (Join-Path $root 'Companion\MateMCP.Agent.Companion.exe'))) { throw 'Installed Companion missing.' }
          if (-not (Test-Path (Join-Path $root 'start-agent-hidden.vbs'))) { throw 'Hidden Agent launcher missing.' }
          if (-not (Test-Path (Join-Path $startup 'MateMCP Agent.lnk'))) { throw 'Background Agent startup shortcut missing.' }
          if (Test-Path (Join-Path $startup 'MateMCP Agent Companion.lnk')) { throw 'Companion must not auto-start at sign-in.' }
          if (-not (Test-Path (Join-Path $programs 'MateMCP Agent Companion.lnk'))) { throw 'Companion Start Menu shortcut missing.' }
          & (Join-Path $root 'uninstall-desktop-windows.ps1')
          if (Test-Path $root) { throw 'Unified uninstall left the installation root behind.' }
          if (Test-Path (Join-Path $programs 'MateMCP Agent Companion.lnk')) { throw 'Companion Start Menu shortcut remained after uninstall.' }
      - name: Build unified Windows archive
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath MateMCP-Desktop-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-Desktop-win-x64
          path: MateMCP-Desktop-win-x64.zip

  publish-desktop-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Desktop package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-Desktop-macos-arm64
          path: release
      - name: Download Windows Desktop package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-Desktop-win-x64
          path: release
      - name: Publish Desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="MateMCP ${GITHUB_REF_NAME}"
            NOTES="MateMCP ${GITHUB_REF_NAME} release for macOS and Windows."
          else
            TAG="agent-latest"
            TITLE="MateMCP Latest"
            NOTES="Latest stable MateMCP Agent and Desktop Companion builds from main. Assets are replaced on each successful source change."
          fi

          for attempt in {1..10}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" >/dev/null 2>&1 || true
            sleep 2
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            release/MateMCP-Desktop-macos-arm64.tar.gz \
            release/MateMCP-Desktop-win-x64.zip \
            --clobber

  smoke-bootstrap-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish-desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      MATEMCP_DESKTOP_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'agent-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap install and uninstall on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          bash scripts/bootstrap-macos.sh
          test -x "$HOME/.local/share/matemcp/MateMCP.Agent"
          test -d "$HOME/Applications/MateMCP Agent Companion.app"
          test -f "$HOME/Library/LaunchAgents/com.matemcp.agent.plist"
          test ! -e "$HOME/Library/LaunchAgents/com.matemcp.agent.companion.plist"
          "$HOME/Library/Application Support/MateMCP/uninstall-desktop-macos.sh"
      - name: Bootstrap install and uninstall on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & scripts/bootstrap-windows.ps1
          $root = Join-Path $env:LOCALAPPDATA 'MateMCP'
          $startup = [Environment]::GetFolderPath('Startup')
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $root 'MateMCP.Agent.exe'))) { throw 'Bootstrap did not install the Agent.' }
          if (-not (Test-Path (Join-Path $root 'Companion\MateMCP.Agent.Companion.exe'))) { throw 'Bootstrap did not install the Companion.' }
          if (-not (Test-Path (Join-Path $root 'start-agent-hidden.vbs'))) { throw 'Bootstrap did not install the hidden Agent launcher.' }
          if (-not (Test-Path (Join-Path $startup 'MateMCP Agent.lnk'))) { throw 'Bootstrap did not configure Agent background startup.' }
          if (Test-Path (Join-Path $startup 'MateMCP Agent Companion.lnk')) { throw 'Bootstrap left Companion in Startup.' }
          if (-not (Test-Path (Join-Path $programs 'MateMCP Agent Companion.lnk'))) { throw 'Bootstrap did not add Companion to Start Menu.' }
          & (Join-Path $root 'uninstall-desktop-windows.ps1')
