name: companion-build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/MateMCP.Agent.Companion/**'
      - 'src/MateMCP.Agent/Program.cs'
      - 'src/MateMCP.Agent/Audit/**'
      - 'src/MateMCP.Agent/Desktop/**'
      - 'scripts/install-companion-macos.sh'
      - 'scripts/uninstall-companion-macos.sh'
      - 'scripts/install-companion-windows.ps1'
      - 'scripts/uninstall-companion-windows.ps1'
      - 'MateMCP.Agent.Companion.slnx'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'src/MateMCP.Agent.Companion/**'
      - 'src/MateMCP.Agent/Program.cs'
      - 'src/MateMCP.Agent/Audit/**'
      - 'src/MateMCP.Agent/Desktop/**'
      - 'scripts/install-companion-macos.sh'
      - 'scripts/uninstall-companion-macos.sh'
      - 'scripts/install-companion-windows.ps1'
      - 'scripts/uninstall-companion-windows.ps1'
      - 'MateMCP.Agent.Companion.slnx'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Restore Companion
        run: dotnet restore src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -r maccatalyst-arm64
      - name: Build Mac Catalyst Companion
        run: dotnet build src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-maccatalyst -r maccatalyst-arm64 --no-restore
      - name: Publish Mac Catalyst Companion
        run: dotnet publish src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-maccatalyst -r maccatalyst-arm64 --self-contained true --no-restore -o package/payload
      - name: Build installable macOS archive
        run: |
          cp scripts/install-companion-macos.sh package/install-companion-macos.sh
          cp scripts/uninstall-companion-macos.sh package/uninstall-companion-macos.sh
          chmod +x package/install-companion-macos.sh package/uninstall-companion-macos.sh
          tar -czf MateMCP-Agent-Companion-macos-arm64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-Agent-Companion-macos-arm64
          path: MateMCP-Agent-Companion-macos-arm64.tar.gz

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Restore Companion
        run: dotnet restore src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -r win-x64
      - name: Build Windows Companion
        run: dotnet build src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore
      - name: Publish Windows Companion
        run: dotnet publish src/MateMCP.Agent.Companion/MateMCP.Agent.Companion.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:WindowsPackageType=None --no-restore -o package/payload
      - name: Build installable Windows archive
        shell: pwsh
        run: |
          Copy-Item scripts/install-companion-windows.ps1 package/install-companion-windows.ps1
          Copy-Item scripts/uninstall-companion-windows.ps1 package/uninstall-companion-windows.ps1
          Compress-Archive -Path package/* -DestinationPath MateMCP-Agent-Companion-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-Agent-Companion-win-x64
          path: MateMCP-Agent-Companion-win-x64.zip
