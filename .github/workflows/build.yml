name: build

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Publish self-contained agent
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o package/payload
      - name: Build installable archive
        run: |
          cp scripts/install-macos.sh package/install-macos.sh
          cp scripts/uninstall-macos.sh package/uninstall-macos.sh
          cp scripts/prepare-external-test-macos.sh package/prepare-external-test-macos.sh
          chmod +x package/install-macos.sh package/uninstall-macos.sh package/prepare-external-test-macos.sh package/payload/MateMCP.Agent
          tar -czf MateMCP-${{ matrix.rid }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-${{ matrix.rid }}
          path: MateMCP-${{ matrix.rid }}.tar.gz
      - name: Publish development release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/relay-mvp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agent-dev"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "MateMCP Agent Development" --notes "Latest development build from feat/relay-mvp. Assets are replaced on each successful push."
          gh release upload "$TAG" "MateMCP-${{ matrix.rid }}.tar.gz" --clobber
      - name: Publish stable release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agent-latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MateMCP Agent Latest" --notes "Latest stable build from main. Assets are replaced on each successful push."
          gh release upload "$TAG" "MateMCP-${{ matrix.rid }}.tar.gz" --clobber
