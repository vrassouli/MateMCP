name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/MateMCP.Agent/**'
      - 'src/MateMCP.Relay/**'
      - 'tests/MateMCP.Agent.Tests/**'
      - 'tests/MateMCP.Relay.Tests/**'
      - 'scripts/bootstrap-macos.sh'
      - 'scripts/bootstrap-windows.ps1'
      - 'scripts/configure-agent-mode-macos.sh'
      - 'scripts/configure-agent-mode-windows.ps1'
      - 'scripts/install-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/uninstall-macos.sh'
      - 'scripts/uninstall-windows.ps1'
      - 'MateMCP.slnx'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/MateMCP.Agent/**'
      - 'src/MateMCP.Relay/**'
      - 'tests/MateMCP.Agent.Tests/**'
      - 'tests/MateMCP.Relay.Tests/**'
      - 'scripts/bootstrap-macos.sh'
      - 'scripts/bootstrap-windows.ps1'
      - 'scripts/configure-agent-mode-macos.sh'
      - 'scripts/configure-agent-mode-windows.ps1'
      - 'scripts/install-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'scripts/uninstall-macos.sh'
      - 'scripts/uninstall-windows.ps1'
      - 'MateMCP.slnx'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ssh-credential-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure ephemeral SSH target
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/bash matemcp-ci
          TEST_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TEST_PASSWORD"
          printf 'matemcp-ci:%s\n' "$TEST_PASSWORD" | sudo chpasswd
          sudo systemctl restart ssh
          echo "MATEMCP_SSH_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "MATEMCP_SSH_TEST_USER=matemcp-ci" >> "$GITHUB_ENV"
          echo "MATEMCP_SSH_TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Run real SSH credential injection test
        run: dotnet test tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SshCredentialInjectionTests

  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify installer syntax
        run: bash -n scripts/configure-agent-mode-macos.sh scripts/install-macos.sh scripts/uninstall-macos.sh
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Run Agent tests
        run: dotnet test tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj -c Release --no-build
      - name: Run Relay tests
        run: dotnet test tests/MateMCP.Relay.Tests/MateMCP.Relay.Tests.csproj -c Release --no-build
      - name: Publish self-contained agent
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o package/payload
      - name: Smoke test packaged local management surface
        shell: bash
        run: |
          export MATEMCP_Mate__Relay__Enabled=false
          export MATEMCP_Mate__Port=45872
          package/payload/MateMCP.Agent >agent.log 2>&1 &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:45872/health >/dev/null; then
              break
            fi
            if ! kill -0 "$AGENT_PID" >/dev/null 2>&1; then
              cat agent.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:45872/health | grep -q '"status":"ok"'
          curl -fsSL http://127.0.0.1:45872/ | grep -q 'Secrets & credentials'
          curl -fsS http://127.0.0.1:45872/secrets | grep -q '^\['
      - name: Build installable archive
        run: |
          cp scripts/configure-agent-mode-macos.sh package/configure-agent-mode-macos.sh
          cp scripts/install-macos.sh package/install-macos.sh
          cp scripts/uninstall-macos.sh package/uninstall-macos.sh
          cp scripts/prepare-external-test-macos.sh package/prepare-external-test-macos.sh
          chmod +x package/configure-agent-mode-macos.sh package/install-macos.sh package/uninstall-macos.sh package/prepare-external-test-macos.sh package/payload/MateMCP.Agent
          tar -czf MateMCP-${{ matrix.rid }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-${{ matrix.rid }}
          path: MateMCP-${{ matrix.rid }}.tar.gz

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify installer syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/configure-agent-mode-windows.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/install-windows.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/uninstall-windows.ps1 -Raw))
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Run Agent tests
        run: dotnet test tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj -c Release --no-build
      - name: Run Relay tests
        run: dotnet test tests/MateMCP.Relay.Tests/MateMCP.Relay.Tests.csproj -c Release --no-build
      - name: Publish self-contained agent
        shell: pwsh
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o package/payload
      - name: Smoke test packaged local management surface
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $env:MATEMCP_Mate__Relay__Enabled = 'false'
          $env:MATEMCP_Mate__Port = '45872'
          $agent = Start-Process -FilePath package/payload/MateMCP.Agent.exe -PassThru -RedirectStandardOutput agent.log -RedirectStandardError agent-error.log
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              if ($agent.HasExited) {
                Get-Content agent.log, agent-error.log -ErrorAction SilentlyContinue
                throw "Packaged Agent exited before becoming healthy."
              }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:45872/health
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Packaged Agent did not become healthy." }
            $ui = Invoke-WebRequest http://127.0.0.1:45872/ -UseBasicParsing
            if ($ui.Content -notlike '*Secrets & credentials*') { throw "Management UI is missing secret management." }
            $secrets = Invoke-WebRequest http://127.0.0.1:45872/secrets -UseBasicParsing
            if ($secrets.Content -notmatch '^\s*\[') { throw "Secrets endpoint did not return a JSON collection." }
          }
          finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Build installable archive
        shell: pwsh
        run: |
          Copy-Item scripts/configure-agent-mode-windows.ps1 package/configure-agent-mode-windows.ps1
          Copy-Item scripts/install-windows.ps1 package/install-windows.ps1
          Copy-Item scripts/uninstall-windows.ps1 package/uninstall-windows.ps1
          Compress-Archive -Path package/* -DestinationPath MateMCP-${{ matrix.rid }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-${{ matrix.rid }}
          path: MateMCP-${{ matrix.rid }}.zip

  publish-agent-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS arm64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-osx-arm64
          path: release
      - name: Download macOS x64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-osx-x64
          path: release
      - name: Download Windows x64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-win-x64
          path: release
      - name: Download Windows arm64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-win-arm64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="MateMCP ${GITHUB_REF_NAME}"
            NOTES="MateMCP ${GITHUB_REF_NAME} release for macOS and Windows."
          else
            TAG="agent-latest"
            TITLE="MateMCP Agent Latest"
            NOTES="Latest stable Agent build from main for macOS and Windows. Assets are replaced on each successful source change."
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"

          gh release upload "$TAG" \
            release/MateMCP-osx-arm64.tar.gz \
            release/MateMCP-osx-x64.tar.gz \
            release/MateMCP-win-x64.zip \
            release/MateMCP-win-arm64.zip \
            --clobber