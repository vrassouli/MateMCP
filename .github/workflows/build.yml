name: build

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Publish self-contained agent
        run: dotnet publish src/MateMCP.Agent/MateMCP.Agent.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o package/payload
      - name: Build installable archive
        run: |
          cp scripts/install-macos.sh package/install-macos.sh
          cp scripts/uninstall-macos.sh package/uninstall-macos.sh
          cp scripts/prepare-external-test-macos.sh package/prepare-external-test-macos.sh
          chmod +x package/install-macos.sh package/uninstall-macos.sh package/prepare-external-test-macos.sh package/payload/MateMCP.Agent
          tar -czf MateMCP-${{ matrix.rid }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: MateMCP-${{ matrix.rid }}
          path: MateMCP-${{ matrix.rid }}.tar.gz

  publish-agent-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/relay-mvp' || github.ref == 'refs/heads/feat/multi-user-control-plane' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-osx-arm64
          path: release
      - name: Download x64 package
        uses: actions/download-artifact@v4
        with:
          name: MateMCP-osx-x64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="agent-latest"
            TITLE="MateMCP Agent Latest"
            NOTES="Latest stable build from main. Assets are replaced on each successful push."
            EXTRA=()
          else
            TAG="agent-dev"
            TITLE="MateMCP Agent Development"
            NOTES="Latest development build. Assets are replaced on each successful feature-branch push."
            EXTRA=(--prerelease)
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" "${EXTRA[@]}" --title "$TITLE" --notes "$NOTES"

          gh release upload "$TAG" \
            release/MateMCP-osx-arm64.tar.gz \
            release/MateMCP-osx-x64.tar.gz \
            --clobber
