name: ssh-credential-integration-pr

on:
  pull_request:
    paths:
      - 'src/MateMCP.Agent/Tools/InteractiveShellTools.cs'
      - 'src/MateMCP.Agent/Tools/InteractiveShellSessionManager.cs'
      - 'src/MateMCP.Agent/Tools/ShellSessionStartResult.cs'
      - 'src/MateMCP.Agent/Tools/ShellSecretInjector.cs'
      - 'src/MateMCP.Agent/Security/**'
      - 'tests/MateMCP.Agent.Tests/SshCredentialInjectionTests.cs'
      - '.github/workflows/ssh-credential-integration-pr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ssh-credential-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure ephemeral SSH target
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/bash matemcp-ci
          TEST_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TEST_PASSWORD"
          printf 'matemcp-ci:%s\n' "$TEST_PASSWORD" | sudo chpasswd
          sudo systemctl restart ssh
          echo "MATEMCP_SSH_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "MATEMCP_SSH_TEST_USER=matemcp-ci" >> "$GITHUB_ENV"
          echo "MATEMCP_SSH_TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
      - run: dotnet restore MateMCP.slnx
      - run: dotnet build MateMCP.slnx -c Release --no-restore
      - name: Run real SSH credential injection test
        run: dotnet test tests/MateMCP.Agent.Tests/MateMCP.Agent.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SshCredentialInjectionTests
