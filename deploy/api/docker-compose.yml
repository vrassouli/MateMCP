services:
  api:
    image: ${MATEMCP_API_IMAGE:-vrassouli/matemcp-api:latest}
    container_name: matemcp-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8081
      MateMCP__PublicUrl: ${MATEMCP_API_PUBLIC_URL:-https://api.matemcp.com}
      MateMCP__RelayUrl: ${MATEMCP_RELAY_URL:-https://relay.matemcp.com}
      MateMCP__InternalApiKey: ${MATEMCP_INTERNAL_API_KEY}
      MateMCP__DatabaseProvider: ${MATEMCP_DB_PROVIDER:-sqlite}
      MateMCP__ConnectionStringBase64: ${MATEMCP_DB_CONNECTION_STRING_BASE64:-}
      MateMCP__BootstrapAdminEmail: ${MATEMCP_BOOTSTRAP_ADMIN_EMAIL:-}
      MateMCP__BootstrapAdminPassword: ${MATEMCP_BOOTSTRAP_ADMIN_PASSWORD:-}
      MateMCP__KeyPath: /data
    volumes:
      - matemcp-api-data:/data
    ports:
      - "${MATEMCP_API_BIND:-0.0.0.0}:${MATEMCP_API_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  matemcp-api-data:
