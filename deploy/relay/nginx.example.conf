# Example Nginx baseline for MateMCP Relay.
# Adapt TLS/server_name paths to your environment.

map $http_upgrade $matemcp_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream matemcp_relay {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name relay.matemcp.com;

    # ssl_certificate /etc/letsencrypt/live/relay.matemcp.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/relay.matemcp.com/privkey.pem;

    client_max_body_size 5m;

    location /relay/agent/ {
        proxy_pass http://matemcp_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $matemcp_connection_upgrade;

        # Relay uses WebSocket keepalive; keep proxy idle timeouts safely above it.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location /mcp/ {
        proxy_pass http://matemcp_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Keep these above Relay__RequestTimeoutSeconds (120s by default).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://matemcp_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
