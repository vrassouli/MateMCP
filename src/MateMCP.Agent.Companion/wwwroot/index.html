<!DOCTYPE html>
<html lang="en" data-bui-theme="light" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateMCP Companion</title>
    <base href="/" />
    <script>
        (() => {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            const applySystemTheme = () => {
                document.documentElement.setAttribute('data-bui-theme', media.matches ? 'dark' : 'light');
            };

            applySystemTheme();
            if (media.addEventListener) {
                media.addEventListener('change', applySystemTheme);
            } else {
                media.addListener(applySystemTheme);
            }
        })();
    </script>
    <link href="_content/Bluent.UI/bluent.ui.theme.default.min.css" rel="stylesheet" />
    <link href="_content/Bluent.UI/bluent.ui.components.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading MateMCP Companion…</div>
    <div id="blazor-error-ui" data-nosnippet role="alert" aria-live="assertive">
        <div class="blazor-error-content">
            <div>
                <strong>Something went wrong</strong>
                <div class="blazor-error-message">MateMCP Companion ran into an unexpected error.</div>
            </div>
            <button type="button" class="reload" onclick="window.location.reload()">Reload</button>
        </div>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
